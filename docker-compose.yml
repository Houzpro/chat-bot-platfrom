services:
  # ============================================================================
  # DATABASES
  # ============================================================================

  qdrant:
    image: qdrant/qdrant:latest
    container_name: chatbot-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT_REST}:6333"
      - "${QDRANT_PORT_GRPC}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  postgres:
    image: postgres:15-alpine
    container_name: chatbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatbot}
      POSTGRES_USER: ${POSTGRES_USER:-chatbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatbot_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Schema is owned by GORM AutoMigrate (see database/db.go) — no need
      # to seed via /docker-entrypoint-initdb.d. The previous bind-mount
      # also caused a "Is a directory" psql error when schema.sql was
      # missing on the host, since Docker created an empty dir in its place.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # LLM SERVER (llama.cpp с OpenAI-совместимым API)
  # ============================================================================

  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: chatbot-llama-cpp
    restart: unless-stopped
    volumes:
      - ./models:/models
    ports:
      - "${LLAMA_CPP_PORT:-8090}:8080"
    command:
      - --model
      - /models/${GGUF_MODEL_FILE:-Qwen3.5-4B-Q4_K_M.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "${N_CTX:-8192}"
      - --threads
      - "${N_THREADS:-6}"
      - --n-gpu-layers
      - "${N_GPU_LAYERS:-0}"
      - --parallel
      - "${LLAMA_PARALLEL:-1}"
      - --reasoning-budget
      - "${LLAMA_REASONING_BUDGET:--1}"
      - --chat-template-kwargs
      - ${LLAMA_CHAT_TEMPLATE_KWARGS:-{}}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5


  # ============================================================================
  # MICROSERVICES
  # ============================================================================

  ai-service:
    build:
      context: ./services/python-ai
      dockerfile: Dockerfile
    container_name: chatbot-ai-service
    restart: unless-stopped
    volumes:
      # Кеш sentence-transformers (cache_folder=EMBEDDING_CACHE_FOLDER → /app/models/embedding)
      - ./models/embedding:/app/models/embedding
      # Дефолтный HF-кеш для reranker (CrossEncoder без cache_folder пишет сюда)
      - ./models/hf-cache:/root/.cache/huggingface
    environment:
      HF_TOKEN: ${HF_TOKEN}
      LLAMA_SERVER_URL: http://llama-cpp:8080
      GGUF_MODEL_PATH: ${GGUF_MODEL_PATH}
      GEN_MAX_NEW_TOKENS: ${GEN_MAX_NEW_TOKENS}
      GEN_TEMPERATURE: ${GEN_TEMPERATURE}
      GEN_TOP_P: ${GEN_TOP_P}
      GEN_TOP_K: ${GEN_TOP_K}
      GEN_DO_SAMPLE: ${GEN_DO_SAMPLE}
      GEN_PRESENCE_PENALTY: ${GEN_PRESENCE_PENALTY}
      GEN_FREQUENCY_PENALTY: ${GEN_FREQUENCY_PENALTY}
      GEN_MIN_P: ${GEN_MIN_P}
      GEN_SYSTEM_BASE_PROMPT: ${GEN_SYSTEM_BASE_PROMPT}
      GEN_USER_PROMPT: ${GEN_USER_PROMPT}
      GEN_STOP_SEQUENCES: ${GEN_STOP_SEQUENCES}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME}
      EMBEDDING_CACHE_FOLDER: ${EMBEDDING_CACHE_FOLDER}
      USE_RERANKER: ${USE_RERANKER}
      RERANKER_MODEL_NAME: ${RERANKER_MODEL_NAME}
      RELEVANCE_ESCALATION_THRESHOLD: ${RELEVANCE_ESCALATION_THRESHOLD}
      EMBEDDING_SIMILARITY_AUTOPASS: ${EMBEDDING_SIMILARITY_AUTOPASS}
      USE_HYBRID_SEARCH: ${USE_HYBRID_SEARCH}
      BM25_WEIGHT: ${BM25_WEIGHT}
      VECTOR_WEIGHT: ${VECTOR_WEIGHT}
    ports:
      - "${AI_SERVICE_PORT}:8000"
    depends_on:
      llama-cpp:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30


  document-parser:
    build:
      context: ./services/document-parser-service
      dockerfile: Dockerfile
    container_name: chatbot-document-parser
    restart: unless-stopped
    environment:
      PORT: ${DOCUMENT_PARSER_PORT}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE}
      BODY_LIMIT: ${BODY_LIMIT}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
      CORS_ALLOW_METHODS: ${CORS_ALLOW_METHODS}
      CORS_ALLOW_HEADERS: ${CORS_ALLOW_HEADERS}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "${DOCUMENT_PARSER_PORT}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  vector-db:
    build:
      context: ./services/vector-db-service
      dockerfile: Dockerfile
    container_name: chatbot-vector-db
    restart: unless-stopped
    environment:
      PORT: ${VECTOR_DB_PORT}
      QDRANT_HOST: ${QDRANT_HOST}
      QDRANT_PORT: ${QDRANT_PORT_GRPC}
      QDRANT_COLLECTION_SIZE: ${QDRANT_COLLECTION_SIZE}
      RAG_SCORE_THRESHOLD: ${RAG_SCORE_THRESHOLD}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
      CORS_ALLOW_METHODS: ${CORS_ALLOW_METHODS}
      CORS_ALLOW_HEADERS: ${CORS_ALLOW_HEADERS}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "${VECTOR_DB_PORT}:8082"
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8082/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5


  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: chatbot-backend
    restart: unless-stopped
    environment:
      PORT: ${BACKEND_PORT}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      DOC_PARSER_URL: ${DOC_PARSER_URL}
      VECTOR_URL: ${VECTOR_URL}
      AI_URL: ${AI_URL}
      CHUNK_SIZE: ${CHUNK_SIZE}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP}
      RAG_MAX_DOC_CHARS: ${RAG_MAX_DOC_CHARS}
      RAG_MAX_RESULTS: ${RAG_MAX_RESULTS}
      RAG_SCORE_THRESHOLD: ${RAG_SCORE_THRESHOLD}
      RAG_MAX_CONTEXT_CHARS: ${RAG_MAX_CONTEXT_CHARS}
      RAG_CONTEXT_TIMEOUT_SEC: ${RAG_CONTEXT_TIMEOUT_SEC:-45}
      CHAT_CONTEXT_WINDOW: ${CHAT_CONTEXT_WINDOW:-5}
      GEN_MAX_NEW_TOKENS: ${GEN_MAX_NEW_TOKENS}
      GEN_TEMPERATURE: ${GEN_TEMPERATURE}
      GEN_TOP_P: ${GEN_TOP_P}
      GEN_TOP_K: ${GEN_TOP_K}
      GEN_DO_SAMPLE: ${GEN_DO_SAMPLE}
      GEN_PRESENCE_PENALTY: ${GEN_PRESENCE_PENALTY}
      GEN_FREQUENCY_PENALTY: ${GEN_FREQUENCY_PENALTY}
      GEN_MIN_P: ${GEN_MIN_P}
      GEN_SYSTEM_BASE_PROMPT: ${GEN_SYSTEM_BASE_PROMPT}
      GEN_USER_PROMPT: ${GEN_USER_PROMPT}
      HTTP_TIMEOUT_SEC: ${HTTP_TIMEOUT_SEC}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE}
      BODY_LIMIT: ${BODY_LIMIT}
      ALLOWED_EXTENSIONS: ${ALLOWED_EXTENSIONS}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
      CORS_ALLOW_METHODS: ${CORS_ALLOW_METHODS}
      CORS_ALLOW_HEADERS: ${CORS_ALLOW_HEADERS}
      LOG_LEVEL: ${LOG_LEVEL}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Model registry — backend scans this dir at boot for *.gguf files,
      # and llama-cpp child containers bind-mount it back at /models.
      MODELS_DIR: /models
      LLAMA_SERVER_URL: http://llama-cpp:8080
      GGUF_MODEL_FILE: ${GGUF_MODEL_FILE:-Qwen3.5-4B-Q4_K_M.gguf}
      # ABSOLUTE path on the docker HOST where ./models lives. Required
      # because the backend (running inside its container) talks to the
      # daemon over the host socket, and Docker rejects relative bind-mount
      # paths. We default to ${PWD}/models — that's the compose project
      # directory at "up" time, which is exactly the host path of ./models.
      # Override in .env when you run backend outside compose.
      LLAMA_MODELS_HOST_DIR: ${LLAMA_MODELS_HOST_DIR:-${PWD}/models}
      LLAMA_DOCKER_NETWORK: ${LLAMA_DOCKER_NETWORK:-chat-bot-platfrom_default}
      # LLAMA_IMAGE is intentionally NOT defaulted here — when unset, the
      # container manager picks ghcr.io/ggml-org/llama.cpp:server (CPU) or
      # :server-cuda (GPU) based on LLAMA_USE_GPU. Override only if you
      # want to pin a specific build.
      LLAMA_IMAGE: ${LLAMA_IMAGE:-}
      LLAMA_PORT_MIN: ${LLAMA_PORT_MIN:-8100}
      LLAMA_PORT_MAX: ${LLAMA_PORT_MAX:-8199}
      LLAMA_N_CTX: ${N_CTX:-8192}
      LLAMA_N_THREADS: ${N_THREADS:-6}
      LLAMA_N_GPU_LAYERS: ${N_GPU_LAYERS:-0}
      LLAMA_PARALLEL: ${LLAMA_PARALLEL:-1}
      # Set LLAMA_USE_GPU=true to spawn dynamic containers with NVIDIA GPU
      # access + the CUDA llama.cpp image. Combine with the docker-compose.gpu.yml
      # override so the static llama-cpp service also gets GPU.
      LLAMA_USE_GPU: ${LLAMA_USE_GPU:-false}
      # KV cache quantization for dynamic containers — same defaults as the
      # GPU compose override. Empty string keeps llama.cpp's default (f16),
      # which is what CPU mode wants.
      LLAMA_CACHE_TYPE_K: ${LLAMA_CACHE_TYPE_K:-}
      LLAMA_CACHE_TYPE_V: ${LLAMA_CACHE_TYPE_V:-}
    volumes:
      # Docker socket — required for the container manager to spawn
      # per-model llama.cpp containers. Docker Desktop on Windows/WSL2
      # exposes the socket at /var/run/docker.sock inside containers.
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only view of the models directory so the seed scan works.
      # Child containers get their own bind-mount via the daemon, not
      # through this share.
      - ./models:/models:ro
    ports:
      - "${BACKEND_PORT}:8080"
    depends_on:
      # Wait for pg_isready, not just "container started" — otherwise the
      # backend boots while Postgres is still initializing and crashes on
      # the first GORM connect. The other services come up fast and don't
      # need the same treatment.
      postgres:
        condition: service_healthy
      document-parser:
        condition: service_started
      vector-db:
        condition: service_started
      ai-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chatbot-frontend
    restart: unless-stopped
    environment:
      # These variables come straight from .env and are referenced by the same
      # names inside nginx.conf.template. The nginx:alpine entrypoint runs
      # envsubst on /etc/nginx/templates/*.template, writing the result to
      # /etc/nginx/conf.d/default.conf on startup.
      BODY_LIMIT: ${BODY_LIMIT}
      BACKEND_PORT: ${BACKEND_PORT}
      HTTP_TIMEOUT_SEC: ${HTTP_TIMEOUT_SEC}
      # Whitelist — only these variables are substituted in the template.
      # Without this, envsubst would also try to replace nginx runtime vars
      # like $host / $remote_addr / $scheme and blow up the config.
      NGINX_ENVSUBST_FILTER: "^(BODY_LIMIT|BACKEND_PORT|HTTP_TIMEOUT_SEC)$$"
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  qdrant_storage:
