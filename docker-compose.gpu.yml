# GPU override — use with: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# Requires NVIDIA GPU drivers and nvidia-container-toolkit
services:
  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command:
      - --model
      - /models/${GGUF_MODEL_FILE:-Qwen3.5-4B-Q4_K_M.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "${N_CTX:-32768}"
      - --threads
      - "${N_THREADS:-6}"
      - --n-gpu-layers
      - "-1"
      - --parallel
      - "${LLAMA_PARALLEL:-2}"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --reasoning-budget
      - "${LLAMA_REASONING_BUDGET:--1}"
      - --chat-template-kwargs
      - ${LLAMA_CHAT_TEMPLATE_KWARGS:-{}}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Tell the container manager to spawn dynamic per-model containers in
  # GPU mode too. Without this override the manager defaults to CPU even
  # when the static llama-cpp container is on GPU.
  backend:
    environment:
      LLAMA_USE_GPU: "true"
      LLAMA_CACHE_TYPE_K: q8_0
      LLAMA_CACHE_TYPE_V: q8_0
